<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/ex01.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Lobster"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lato"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/a3ad67cf03.js"
      crossorigin="anonymous"
    ></script>

    <title>Ex01 - Buoi 6</title>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1 class="title">Hey there</h1>
        <p class="desc">
          <span class="desc-strong">We'd like to hear from you.</span> Send us
          your message or just say hy with our contact form or directly via
          phone, we love to chat.
        </p>

        <div class="field">
          <div class="field-icon">
            <i class="fa-solid fa-user icon-left"></i>
          </div>

          <div class="field-control">
            <span class="tip">Enter your name</span>
            <input type="text" placeholder="Your name" />
            <i class="fa-solid fa-star icon-right icon-star"></i>
            <i class="fa-solid fa-xmark icon-right icon-close"></i>
          </div>
        </div>

        <div class="field">
          <div class="field-icon">
            <i class="fa-solid fa-envelope icon-left"></i>
          </div>

          <div class="field-control">
            <span class="tip">Enter your email</span>
            <input type="text" placeholder="your@domain.com" />
            <i class="fa-solid fa-star icon-right icon-star"></i>
            <i class="fa-solid fa-xmark icon-right icon-close"></i>
          </div>
        </div>

        <div class="field">
          <div class="field-icon">
            <i class="fa-solid fa-mobile-screen icon-left"></i>
          </div>

          <div class="field-control">
            <span class="tip">Enter your phone number</span>
            <input type="text" placeholder="+44 00 123" />
          </div>
        </div>

        <div class="field">
          <div class="field-icon">
            <i class="fa-solid fa-book icon-left"></i>
          </div>

          <div class="field-control">
            <span class="tip">Choose your subject</span>
            <select>
              <option value="" selected disabled>Subject</option>
              <option value="">Support</option>
              <option value="">Feedback</option>
              <option value="">Other</option>
            </select>
            <i class="fa-solid fa-sort icon-right icon-down"></i>
          </div>
        </div>

        <div class="field field-textarea">
          <div class="field-icon">
            <i class="fa-solid fa-message icon-left"></i>
          </div>

          <div class="field-control">
            <span class="tip">Enter your message</span>
            <textarea placeholder="Message"></textarea>
            <i class="fa-solid fa-star icon-right icon-star"></i>
            <i class="fa-solid fa-xmark icon-right icon-close"></i>
          </div>
        </div>

        <div class="actions">
          <label class="copy">
            <input class="copy-check" type="checkbox" checked />
            <span>Send me a copy of this message</span>
          </label>
          <button class="btn-send" type="button">SEND</button>
        </div>
      </div>
    </div>
  </body>
</html>
