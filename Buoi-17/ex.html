<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Bài tập về nhà K2 Buổi 17</title>
  </head>
  <body>
    <div class="container">
      <section id="bai1">
        <h1>Bài 1: Hoán vị 2 số</h1>
        <input type="number" id="b1_a" placeholder="Nhập số a" />
        <input type="number" id="b1_b" placeholder="Nhập số b" />
        <button onclick="bai1()">Hoán vị</button>
        <div class="result-box" id="res1"></div>
      </section>
      <section class="bai2">
        <h1>Bài 2: Tìm số lớn nhất</h1>
        <input type="number" id="b2_a" placeholder="Nhập số a" />
        <input type="number" id="b2_b" placeholder="Nhập số b" />
        <input type="number" id="b2_c" placeholder="Nhập số c" />
        <button onclick="bai2()">Tìm số lớn nhất</button>
        <div class="result-box" id="res2"></div>
      </section>
      <section class="bai3">
        <h1>Bài 3: Kiểm tra cùng dấu</h1>
        <input type="number" id="b3_a" placeholder="Nhập số a" />
        <input type="number" id="b3_b" placeholder="Nhập số b" />
        <button onclick="bai3()">Kiểm tra cùng dấu</button>
        <div class="result-box" id="res3"></div>
      </section>
      <section class="bai4">
        <h1>Bài 4: Sắp xếp 3 số a, b, c</h1>
        <input type="number" id="b4_a" placeholder="Nhập số a" />
        <input type="number" id="b4_b" placeholder="Nhập số b" />
        <input type="number" id="b4_c" placeholder="Nhập số c" />
        <button onclick="bai4()">Sắp xếp</button>
        <div class="result-box" id="res4"></div>
      </section>
      <section class="bai5">
        <h1>Bài 5: Tính tiền taxi</h1>
        <input type="number" id="b5_km" placeholder="Nhập số km" />
        <button onclick="bai5()">Tính tiền taxi</button>
        <div class="result-box" id="res5"></div>
      </section>
      <section class="bai6">
        <h1>Bài 6: Tính tiền điện</h1>
        <input type="number" id="b6_kw" placeholder="Nhập số kWh tiêu thụ" />
        <button onclick="bai6()">Tính tiền điện</button>
        <div class="result-box" id="res6"></div>
      </section>
      <section class="bai7">
        <h1>Bài 7: Tính giá trị biểu thức</h1>
        <h2>S = 1*2 + 2*3 + 3*4 + ... + n*(n+1)</h2>
        <input type="number" id="b7_n" placeholder="Nhập n" />
        <button onclick="bai7()">Tính</button>
        <div class="result-box" id="res7"></div>
      </section>
      <section class="bai8">
        <h1>Bài 8: Kiểm tra số nguyên tố</h1>
        <input type="number" id="b8_n" placeholder="Nhập n" />
        <button onclick="bai8()">Kiểm tra</button>
        <div class="result-box" id="res8"></div>
      </section>
      <section class="bai9">
        <h1>Bài 9: Vẽ bảng cửu chương</h1>
        <button onclick="bai9()">Vẽ bảng cửu chương</button>
        <div class="result-box" id="res9"></div>
      </section>
    </div>
    <script src="./js/ex.js"></script>
  </body>
</html>
